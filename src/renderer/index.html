<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' data:; worker-src 'self' blob:; frame-src toolkit-outil:">
  <title>Toolkit</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="application">
    <nav id="barre-laterale" class="barre-laterale" aria-label="Navigation"></nav>
    <div class="zone-principale">
      <div id="onglets" class="barre-onglets" role="tablist"></div>
      <!-- La bibliothèque et chaque outil ouvert sont des panneaux superposés :
           seul le panneau de l'onglet actif est visible. -->
      <div id="zone-contenu" class="zone-contenu">
        <main id="bibliotheque" class="bibliotheque panneau"></main>
      </div>
    </div>
    <aside id="details" class="details" hidden></aside>
  </div>
  <div id="notifications" class="notifications" aria-live="polite"></div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
